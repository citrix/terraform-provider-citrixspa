# Terraform Provider release workflow.
#
# Normal flow (tag push): tests → acceptance tests → goreleaser release.
# Urgent flow (manual dispatch with skip_tests): goreleaser release only.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and go directly to release (for urgent cases when acceptance tests are flaky)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Build + vet gate (fast, no credentials). Unit + acceptance tests run in the
  # E2E suite below (the `tests` scenario), so they are not duplicated here.
  # --------------------------------------------------------------------------
  test:
    name: Build & Vet
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  # --------------------------------------------------------------------------
  # E2E suite — golden, tooling, migrate, and unit + acceptance tests.
  # Must pass before releasing (acceptance is included via the `tests` scenario).
  # --------------------------------------------------------------------------
  e2e:
    name: E2E Suite
    if: ${{ !inputs.skip_tests }}
    needs: test
    uses: ./.github/workflows/e2e.yml
    with:
      scenario: all
    # Pass only the E2E tenant secrets (least privilege) — not the repo PATs.
    secrets:
      CITRIX_CUSTOMER_ID: ${{ secrets.CITRIX_CUSTOMER_ID }}
      CITRIX_CLIENT_ID: ${{ secrets.CITRIX_CLIENT_ID }}
      CITRIX_CLIENT_SECRET: ${{ secrets.CITRIX_CLIENT_SECRET }}
      CITRIX_CUSTOMER_ID_B: ${{ secrets.CITRIX_CUSTOMER_ID_B }}
      CITRIX_CLIENT_ID_B: ${{ secrets.CITRIX_CLIENT_ID_B }}
      CITRIX_CLIENT_SECRET_B: ${{ secrets.CITRIX_CLIENT_SECRET_B }}

  # --------------------------------------------------------------------------
  # Release — runs after tests pass, or immediately when skip_tests is true
  # --------------------------------------------------------------------------
  goreleaser:
    needs: [test, e2e]
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.1.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          version="${GITHUB_REF_NAME#v}"
          # Prefer the section matching the tag (## [x.y.z]); fall back to the
          # ## [Unreleased] section if it has not been promoted yet.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            awk '
              /^## \[[Uu]nreleased\]/ {f=1; next}
              f && /^## \[/ {exit}
              f {print}
            ' CHANGELOG.md > "$notes"
          fi
          # Drop leading blank lines so the release body starts cleanly.
          sed -i -e '/./,$!d' "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"
          echo "----- release notes -----"
          cat "$notes"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --release-notes=${{ steps.notes.outputs.path }}
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GPG fingerprint used by GoReleaser to sign the SHA256SUMS checksum
          # file, as required by the Terraform Registry.
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Publish CHANGELOG as the GitHub release notes
        # GoReleaser does not reliably override the release body when the tag is
        # annotated — it uses the tag's message instead of --release-notes. Force
        # the body from the extracted CHANGELOG section here so the release notes
        # are always the changelog regardless of how the tag was created.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file "${{ steps.notes.outputs.path }}"
